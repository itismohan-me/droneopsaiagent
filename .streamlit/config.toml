[theme]
primaryColor = "#0066cc"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
port = 8501
enableXsrfProtection = true
enableCORS = true

[client]
showErrorDetails = true
showWarningOnDirectExecution = true

[logger]
level = "info"
